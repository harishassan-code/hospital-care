name: CI

# Every push to every branch is checked, so problems show up the day they're pushed, not at the weekly
# integration. Pull requests (each developer's weekly PR, the integration PR) are checked too.
on:
  pull_request:
  push:
    branches: ['**']
  # A manual run (Actions → CI → Run workflow) runs every job on the chosen branch, e2e included.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_deploy_config.py
      - run: python3 scripts/aidlc_board.py --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hospitalcare
          POSTGRES_USER: hospitalcare
          POSTGRES_PASSWORD: hospitalcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospitalcare" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hospitalcare:hospitalcare@localhost:5432/hospitalcare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q
      - name: Deploy checks (DEBUG off, dummy key; B13)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-dummy-key-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The MVP acceptance scenario (proposal §23, B12, #57): one browser test across the real API, database and built
  # frontend. It is the slowest job (browser download, production build, seed, browser run), so it runs on pull
  # requests, on pushes to main and on demand, not on every push to every branch. docs/testing/mvp-scenario.md.
  e2e:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hospitalcare
          POSTGRES_USER: hospitalcare
          POSTGRES_PASSWORD: hospitalcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospitalcare" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hospitalcare:hospitalcare@localhost:5432/hospitalcare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install the backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Migrate and seed the demo data
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_demo
      - name: Start the API
        working-directory: backend
        run: |
          nohup python manage.py runserver localhost:8000 > api.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:8000/api/health/; do sleep 1; done'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and preview the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --host localhost --port 5173 --strictPort > ui.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:5173; do sleep 1; done'
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck the scenario
        working-directory: e2e
        run: npm run typecheck
      - name: Run the MVP scenario
        working-directory: e2e
        run: npx playwright test
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
