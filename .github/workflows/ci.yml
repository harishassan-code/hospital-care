name: CI

# Every push to every branch is checked, so problems show up the day they're pushed, not at the weekly
# integration. Pull requests (each developer's weekly PR, the integration PR) are checked too.
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_deploy_config.py
      - run: python3 scripts/aidlc_board.py --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hospitalcare
          POSTGRES_USER: hospitalcare
          POSTGRES_PASSWORD: hospitalcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospitalcare" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hospitalcare:hospitalcare@localhost:5432/hospitalcare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Story #57: the MVP scenario in a real browser against real servers. Slower, so only on pull requests
  # (and by hand from the Actions tab), not on every push.
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hospitalcare
          POSTGRES_USER: hospitalcare
          POSTGRES_PASSWORD: hospitalcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospitalcare" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hospitalcare:hospitalcare@localhost:5432/hospitalcare
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      CSRF_TRUSTED_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: API (migrate, seed, run)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python manage.py migrate
          python manage.py seed_demo
          python manage.py runserver 8000 &
      - name: Frontend (build, preview)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vite preview --port 4173 --strictPort &
      - name: Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx wait-on -t 60000 http://localhost:8000/api/health/ http://localhost:4173
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

