# Render Blueprint for the staging backend + database.
# Render dashboard → New → Blueprint → pick this repo. Deploys `main` automatically.
databases:
  - name: hospital-care-db
    plan: free
    databaseName: hospitalcare
    user: hospitalcare

services:
  - type: web
    name: hospital-care-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-care-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Set both to the Vercel frontend URL once it exists:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
