# Render Blueprint for the staging backend + database.
# Render dashboard → New → Blueprint → pick this repo. Deploys `main` automatically.
# The build also runs seed_demo (safe to re-run: it only adds data to empty tables), so staging always
# has demo data and one login per role. Staging only: never point this at a database with real patients.
databases:
  - name: hospital-care-db
    plan: free
    databaseName: hospitalcare
    user: hospitalcare

services:
  - type: web
    name: hospital-care-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-care-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # HTTPS only: with DEBUG off the app redirects to HTTPS (health check excepted) and sends HSTS (B13).
      # How long browsers remember HSTS, in seconds. Raise it to 31536000 after a week of HTTPS-only staging.
      - key: DJANGO_HSTS_SECONDS
        value: "3600"
      # Django admin (/admin/) is not routed on staging (B13, F6). Set to "true" to route it, and back to "false" after.
      - key: DJANGO_ADMIN_ENABLED
        value: "false"
      # Render's proxy is the one hop in front of the app. Sign-in and sign-up limits count per client address,
      # read from X-Forwarded-For through that many proxies (B13, F4). Confirm on staging before relying on it.
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      # Set both to the Vercel frontend URL once it exists (e.g. https://hospital-care.vercel.app).
      # The browser only talks to Vercel, which forwards /api/* here (frontend/vercel.json), so this
      # is what lets the CSRF check accept requests from the staging site.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
